<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J3 Match Matrix</title><style>
body{font:14px -apple-system,"Noto Sans JP",sans-serif;background:#f7f8fa;color:#172033;margin:0;padding:18px}main{max-width:1250px;margin:auto}.wrap{overflow:auto;max-height:75vh;background:white;border:1px solid #ddd;border-radius:10px}table{border-spacing:0;border-collapse:separate}th,td{padding:9px;border-right:1px solid #eee;border-bottom:1px solid #eee;white-space:nowrap;text-align:center;min-width:40px}thead th{position:sticky;top:0;background:#eef1f5;z-index:2}th:first-child{position:sticky;left:0;background:#eef1f5;z-index:3;text-align:left}thead th:first-child{z-index:4}.kita th,.kita td,.kitacol{background:#fff2b0!important}.win{color:#111827}.loss{color:#111827}.draw{color:#d62828}.result-symbol{display:inline-block;font-size:18px;line-height:1.1;font-weight:800}.result-symbol.win{color:#111827}.result-symbol.loss{color:#111827}.result-symbol.draw{color:#d62828}.match-mark{display:inline-flex;flex-direction:column;align-items:center;gap:2px;margin:0 2px}.venue-label{font-size:10px;line-height:1;font-weight:800;color:#344054}.match-mark.away .venue-label{color:#a24118}.match-mark.home .venue-label{color:#175c96}td button{display:inline-flex;align-items:center;justify-content:center;gap:3px}td button{border:0;background:transparent;font:inherit;font-weight:bold;color:inherit;cursor:pointer}#detail{min-height:36px}p{color:#667085}button#refresh{padding:9px;margin-bottom:12px}
</style></head><body><main><a href="../">← シミュレーター</a><h1>Match Matrix｜J3対戦勝敗表</h1><p>全20クラブの公式確定結果。行のクラブから見て ○ 白星（黒枠）／● 黒星／△ 引き分け（赤枠）。未対戦は－、同一クラブは—。複数対戦は併記。記号の下の H＝ホーム、A＝アウェー（行のクラブ基準）。</p><button id="refresh">公式結果を確認</button><p id="status" role="status">読込中</p><div class="wrap"><table aria-label="20クラブ対戦勝敗表"><thead id="head"></thead><tbody id="body"></tbody></table></div><p id="detail" aria-live="polite">記号を押すとスコアを表示します。</p><p id="audit"></p></main><script src="../official-api-config.js"></script><script src="../shared-results.js"></script><script>
const teams=["岐阜","愛媛","鹿児島","相模原","鳥取","FC大阪","長野","滋賀","熊本","栃木SC","琉球","讃岐","山口","奈良","高知","北九州","松本","金沢","群馬","福島"],$=id=>document.getElementById(id);
function aggregate(games){
 const cells=new Map(teams.map(t=>[t,new Map()])),stats=new Map(teams.map(t=>[t,{w:0,d:0,l:0}]));
 for(const g of games){
  if(!Array.isArray(g)||g.length!==4||!teams.includes(g[0])||!teams.includes(g[1])||g[0]===g[1]||!g.slice(2).every(n=>Number.isInteger(n)&&n>=0&&n<=30))throw Error('不正な試合データ');
  const [h,a,hg,ag]=g;
  for(const [club,opp,gf,ga,home] of [[h,a,hg,ag,true],[a,h,ag,hg,false]]){
   const m=cells.get(club),arr=m.get(opp)||[],symbol=gf>ga?'○':gf<ga?'●':'△';
   arr.push({symbol,gf,ga,home});m.set(opp,arr);stats.get(club)[gf>ga?'w':gf<ga?'l':'d']++;
  }
 }
 if([...stats.values()].reduce((sum,s)=>sum+s.w+s.d+s.l,0)!==games.length*2)throw Error('集計不一致');
 return {cells,stats};
}
function render(){
 try{
  const games=J3Results.initialGames,{cells,stats}=aggregate(games);
  $('head').replaceChildren();$('body').replaceChildren();
  const hr=document.createElement('tr');
  for(const name of ['クラブ＼対戦相手',...teams,'勝','分','敗','勝点']){const th=document.createElement('th');th.textContent=name;if(name==='北九州')th.className='kitacol';hr.append(th)}$('head').append(hr);
  for(const club of teams){
   const tr=document.createElement('tr');if(club==='北九州')tr.className='kita';
   const th=document.createElement('th');th.textContent=club;tr.append(th);
   for(const opp of teams){
    const td=document.createElement('td');if(opp==='北九州')td.classList.add('kitacol');
    const ms=cells.get(club).get(opp)||[];
    if(club===opp)td.textContent='—';else if(!ms.length)td.textContent='－';else{
     const b=document.createElement('button');for(const m of ms){const mark=document.createElement('span');mark.className='match-mark '+(m.home?'home':'away');const span=document.createElement('span');span.className='result-symbol '+(m.symbol==='○'?'win':m.symbol==='●'?'loss':'draw');span.textContent=m.symbol;const venue=document.createElement('span');venue.className='venue-label';venue.textContent=m.home?'H':'A';mark.append(span,venue);b.append(mark)}
     b.setAttribute('aria-label',club+'対'+opp+'：'+ms.map(m=>m.symbol+' '+(m.home?'ホーム':'アウェー')).join('、'));
     b.onclick=()=>$('detail').textContent=club+' 対 '+opp+'：'+ms.map(m=>(m.home?'ホーム':'アウェー')+' '+m.gf+'－'+m.ga+'（'+m.symbol+'）').join(' ／ ');
     td.classList.add(ms.at(-1).symbol==='○'?'win':ms.at(-1).symbol==='●'?'loss':'draw');td.append(b);
    }tr.append(td);
   }
   const s=stats.get(club);for(const n of [s.w,s.d,s.l,3*s.w+s.d]){const td=document.createElement('td');td.textContent=n;tr.append(td)}$('body').append(tr);
  }
  $('status').textContent=J3Results.statusText();$('audit').textContent='公式確定'+games.length+'試合／結果ID '+J3Results.resultId()+'／対象日 '+J3Results.baseDate;
 }catch(e){$('status').textContent='表示エラー：'+e.message}
}
async function refresh(force=false){$('refresh').disabled=true;try{await J3Results.refreshOfficial(force);render()}finally{$('refresh').disabled=false}}
$('refresh').onclick=()=>refresh(true);
window.addEventListener('storage',e=>{if(e.key===J3Results.feedKey){J3Results.restoreCachedFeed();render()}});
window.addEventListener('focus',()=>refresh());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
setInterval(()=>{if(!document.hidden)refresh()},300000);
render();refresh();
</script></body></html>
