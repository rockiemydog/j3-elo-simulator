name: Results and tracker regression
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node tests/regression.cjs
      - run: node tests/result-sync.test.cjs
      - run: node --test tests/feed-resilience.test.cjs
      - run: node --test tests/next-fixture.test.cjs
      - run: python tests/test_official_schedule.py
      - run: python tests/test_official_results.py
      - run: python tests/test_result_notification.py
      - run: python tests/test_result_publication.py

      - run: python tests/test_team_stats.py
      - run: node --test tests/team-stats.test.cjs
      - run: node --test tests/forecast-insights.test.cjs
      - run: node --test tests/dashboard.test.cjs
