name: Results and tracker regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/regression.cjs
      - run: node tests/result-sync.test.cjs
      - run: python tests/test_official_results.py
      - run: python tests/test_result_notification.py
