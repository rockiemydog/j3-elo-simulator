name: Automatic official J3 results
on:
  push:
    paths:
      - scripts/update-official-results.py
      - .github/workflows/official-results.yml
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: official-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate finished official matches
        id: fetch
        run: python scripts/update-official-results.py
      - name: Publish updated feed
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add official-results.json
          git commit -m 'Update official J3 finished results'
          git push origin HEAD:main
