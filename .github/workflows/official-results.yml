name: Automatic official J3 results
on:
  push:
    paths:
      - scripts/update-official-results.py
      - scripts/notify-official-results.py
      - scripts/publish-official-results.py
      - .github/workflows/official-results.yml
  workflow_dispatch:
    inputs:
      test_email:
        description: Send a test email after checking official results
        type: boolean
        default: false
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: official-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Reruns must use today's feed, not the original run's old commit.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record the actual checkout for test notifications
        run: echo "NOTIFICATION_CHECKOUT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Fetch and validate finished official matches
        id: fetch
        run: |
          cp official-results.json "$RUNNER_TEMP/j3-results-before.json"
          python scripts/update-official-results.py
      - name: Publish updated feed
        id: publish
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish-official-results.py
      - name: Email successful official result changes
        if: steps.fetch.outputs.changed == 'true' || inputs.test_email == true
        continue-on-error: true
        env:
          SMTP_USERNAME: ${{ secrets.J3_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.J3_SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.J3_NOTIFICATION_EMAIL }}
          NOTIFICATION_COMMIT: ${{ steps.publish.outputs.commit || env.NOTIFICATION_CHECKOUT }}
          TEST_EMAIL: ${{ inputs.test_email }}
        run: |
          if [ "$TEST_EMAIL" = "true" ]; then
            python scripts/notify-official-results.py --before "$RUNNER_TEMP/j3-results-before.json" --test
          else
            python scripts/notify-official-results.py --before "$RUNNER_TEMP/j3-results-before.json"
          fi
