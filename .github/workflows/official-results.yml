name: Automatic official J3 results
on:
  push:
    branches:
      - main
    paths:
      - scripts/update-official-results.py
      - scripts/publish-official-results.py
      - scripts/update-official-schedule.py
      - scripts/capture-predictions.cjs
      - forecast-insights.js
      - .github/workflows/official-results.yml
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: official-results
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # Reruns must use today's feed, not the original run's old commit.
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate collectors before publishing
        run: |
          python tests/test_official_results.py
          python tests/test_official_schedule.py
          python tests/test_result_publication.py
          node --test tests/forecast-insights.test.cjs
      - name: Fetch and validate finished official matches
        id: fetch
        run: |
          cp official-results.json "$RUNNER_TEMP/j3-results-before.json"
          python scripts/update-official-results.py
      - name: Publish updated feed
        id: publish
        if: steps.fetch.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish-official-results.py
      - name: Fetch official Kitakyushu and all-club schedules
        id: schedule
        run: python scripts/update-official-schedule.py --league-output league-schedule.json
      - name: Publish updated schedule
        if: steps.schedule.outputs.changed == 'true'
        env:
          PUBLISH_SCHEDULE: 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish-official-results.py
      - name: Capture prospective forecasts after validated results and schedules
        run: node scripts/capture-predictions.cjs
      - name: Publish append-only prediction journal (no notifications)
        env:
          PUBLISH_JOURNAL: 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish-official-results.py
